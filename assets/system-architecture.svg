<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081426"/>
      <stop offset="100%" stop-color="#0C2340"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#172554" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#451A03" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="emeraldCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#022C22" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2E1065" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="1000" height="620" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Column 1: Ingestion & Sentinel -->
  <g transform="translate(30, 40)">
    <rect width="170" height="540" rx="12" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="4 2" fill-opacity="0.6"/>
    <text x="85" y="32" fill="#60A5FA" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">1. INGESTION &amp; SENTINEL</text>
    
    <!-- Node A -->
    <g transform="translate(15, 60)" filter="url(#shadow)">
      <rect width="140" height="90" rx="8" fill="url(#blueCard)" stroke="#3B82F6" stroke-width="1.2"/>
      <text x="70" y="35" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Razorpay</text>
      <text x="70" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Webhooks</text>
      <text x="70" y="72" fill="#93C5FD" font-family="sans-serif" font-size="10" text-anchor="middle">payment.failed / bounce</text>
    </g>

    <!-- Node B -->
    <g transform="translate(15, 210)" filter="url(#shadow)">
      <rect width="140" height="90" rx="8" fill="url(#blueCard)" stroke="#3B82F6" stroke-width="1.2"/>
      <text x="70" y="35" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">HMAC-SHA256</text>
      <text x="70" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Auth &amp; Idemp</text>
      <text x="70" y="72" fill="#93C5FD" font-family="sans-serif" font-size="10" text-anchor="middle">Redis TTL Guard</text>
    </g>

    <!-- Node C -->
    <g transform="translate(15, 360)" filter="url(#shadow)">
      <rect width="140" height="90" rx="8" fill="url(#blueCard)" stroke="#3B82F6" stroke-width="1.2"/>
      <text x="70" y="35" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Passive Bank</text>
      <text x="70" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Health Sentinel</text>
      <text x="70" y="72" fill="#93C5FD" font-family="sans-serif" font-size="10" text-anchor="middle">50-Event Window</text>
    </g>

    <!-- Connectors -->
    <path d="M 85 150 L 85 210" stroke="#60A5FA" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 85 300 L 85 360" stroke="#60A5FA" stroke-width="2"/>
  </g>

  <!-- Column 2: Diagnostic Reasoning -->
  <g transform="translate(225, 40)">
    <rect width="170" height="540" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 2" fill-opacity="0.6"/>
    <text x="85" y="32" fill="#FBBF24" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">2. DIAGNOSIS (AI)</text>

    <!-- Node D -->
    <g transform="translate(15, 110)" filter="url(#shadow)">
      <rect width="140" height="90" rx="8" fill="url(#amberCard)" stroke="#F59E0B" stroke-width="1.2"/>
      <text x="70" y="35" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Tier 0: Rule</text>
      <text x="70" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Classifier (&lt;5ms)</text>
      <text x="70" y="72" fill="#FCD34D" font-family="sans-serif" font-size="10" text-anchor="middle">78% Fast Match</text>
    </g>

    <!-- Node E -->
    <g transform="translate(15, 260)" filter="url(#shadow)">
      <rect width="140" height="90" rx="8" fill="url(#amberCard)" stroke="#F59E0B" stroke-width="1.2"/>
      <text x="70" y="35" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Tier 1: Gemini</text>
      <text x="70" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">2.5 / Groq LLM</text>
      <text x="70" y="72" fill="#FCD34D" font-family="sans-serif" font-size="10" text-anchor="middle">Ambiguous Cases</text>
    </g>

    <!-- Node F -->
    <g transform="translate(15, 410)" filter="url(#shadow)">
      <rect width="140" height="90" rx="8" fill="url(#amberCard)" stroke="#F59E0B" stroke-width="1.2"/>
      <text x="70" y="35" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">DGN-01..12</text>
      <text x="70" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Root Cause</text>
      <text x="70" y="72" fill="#FCD34D" font-family="sans-serif" font-size="10" text-anchor="middle">Confidence &gt; 90%</text>
    </g>

    <path d="M 85 200 L 85 260" stroke="#FBBF24" stroke-width="2"/>
    <path d="M 85 350 L 85 410" stroke="#FBBF24" stroke-width="2"/>
  </g>

  <!-- Column 3: Policy Gateway -->
  <g transform="translate(420, 40)">
    <rect width="170" height="540" rx="12" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="4 2" fill-opacity="0.6"/>
    <text x="85" y="32" fill="#A78BFA" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">3. POLICY GATEWAY</text>

    <!-- Node G -->
    <g transform="translate(15, 110)" filter="url(#shadow)">
      <rect width="140" height="90" rx="8" fill="url(#purpleCard)" stroke="#8B5CF6" stroke-width="1.2"/>
      <text x="70" y="35" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Deterministic</text>
      <text x="70" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Policy Engine</text>
      <text x="70" y="72" fill="#DDD6FE" font-family="sans-serif" font-size="10" text-anchor="middle">LLM Never Authorizes</text>
    </g>

    <!-- Node H -->
    <g transform="translate(15, 260)" filter="url(#shadow)">
      <rect width="140" height="90" rx="8" fill="url(#purpleCard)" stroke="#8B5CF6" stroke-width="1.2"/>
      <text x="70" y="35" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Regulatory &amp;</text>
      <text x="70" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Stopping Gates</text>
      <text x="70" y="72" fill="#DDD6FE" font-family="sans-serif" font-size="10" text-anchor="middle">TRAI / Margin Floor</text>
    </g>

    <!-- Node K -->
    <g transform="translate(15, 410)" filter="url(#shadow)">
      <rect width="140" height="90" rx="8" fill="url(#purpleCard)" stroke="#8B5CF6" stroke-width="1.2"/>
      <text x="70" y="35" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">A1..A9 Action</text>
      <text x="70" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Catalog Dispatch</text>
      <text x="70" y="72" fill="#DDD6FE" font-family="sans-serif" font-size="10" text-anchor="middle">Redlock Mutex</text>
    </g>

    <path d="M 85 200 L 85 260" stroke="#A78BFA" stroke-width="2"/>
    <path d="M 85 350 L 85 410" stroke="#A78BFA" stroke-width="2"/>
  </g>

  <!-- Column 4: Channels & Execution -->
  <g transform="translate(615, 40)">
    <rect width="170" height="540" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 2" fill-opacity="0.6"/>
    <text x="85" y="32" fill="#34D399" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">4. EXECUTION MESH</text>

    <!-- WA -->
    <g transform="translate(15, 60)" filter="url(#shadow)">
      <rect width="140" height="75" rx="8" fill="url(#emeraldCard)" stroke="#10B981" stroke-width="1.2"/>
      <text x="70" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">WhatsApp 1-Click</text>
      <text x="70" y="50" fill="#6EE7B7" font-family="sans-serif" font-size="10" text-anchor="middle">Meta Cloud Sandbox</text>
    </g>

    <!-- Voice -->
    <g transform="translate(15, 155)" filter="url(#shadow)">
      <rect width="140" height="75" rx="8" fill="url(#emeraldCard)" stroke="#10B981" stroke-width="1.2"/>
      <text x="70" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Hinglish Voice Agent</text>
      <text x="70" y="50" fill="#6EE7B7" font-family="sans-serif" font-size="10" text-anchor="middle">LiveKit WebRTC</text>
    </g>

    <!-- Retries -->
    <g transform="translate(15, 250)" filter="url(#shadow)">
      <rect width="140" height="75" rx="8" fill="url(#emeraldCard)" stroke="#10B981" stroke-width="1.2"/>
      <text x="70" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Mandate Retries</text>
      <text x="70" y="50" fill="#6EE7B7" font-family="sans-serif" font-size="10" text-anchor="middle">Non-Peak Windows</text>
    </g>

    <!-- Dunning -->
    <g transform="translate(15, 345)" filter="url(#shadow)">
      <rect width="140" height="75" rx="8" fill="url(#emeraldCard)" stroke="#10B981" stroke-width="1.2"/>
      <text x="70" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">B2B Staged Dunning</text>
      <text x="70" y="50" fill="#6EE7B7" font-family="sans-serif" font-size="10" text-anchor="middle">Smart Collect VA</text>
    </g>

    <!-- HITL -->
    <g transform="translate(15, 440)" filter="url(#shadow)">
      <rect width="140" height="75" rx="8" fill="url(#emeraldCard)" stroke="#10B981" stroke-width="1.2"/>
      <text x="70" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Human Console</text>
      <text x="70" y="50" fill="#6EE7B7" font-family="sans-serif" font-size="10" text-anchor="middle">Disputes / Credit Notes</text>
    </g>
  </g>

  <!-- Column 5: Settlement & Radar -->
  <g transform="translate(805, 40)">
    <rect width="165" height="540" rx="12" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="4 2" fill-opacity="0.6"/>
    <text x="82" y="32" fill="#22D3EE" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">5. SETTLEMENT</text>

    <!-- Node P -->
    <g transform="translate(12, 110)" filter="url(#shadow)">
      <rect width="140" height="90" rx="8" fill="#083344" stroke="#06B6D4" stroke-width="1.2"/>
      <text x="70" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Razorpay Settlement</text>
      <text x="70" y="50" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Hard-Stop in 64ms</text>
      <text x="70" y="70" fill="#67E8F9" font-family="sans-serif" font-size="10" text-anchor="middle">Abort In-Flight Jobs</text>
    </g>

    <!-- Node R -->
    <g transform="translate(12, 260)" filter="url(#shadow)">
      <rect width="140" height="90" rx="8" fill="#083344" stroke="#06B6D4" stroke-width="1.2"/>
      <text x="70" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">SHA-256 Ledger</text>
      <text x="70" y="50" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Audit Hash Chain</text>
      <text x="70" y="70" fill="#67E8F9" font-family="sans-serif" font-size="10" text-anchor="middle">Merkle Verification</text>
    </g>

    <!-- Node S -->
    <g transform="translate(12, 410)" filter="url(#shadow)">
      <rect width="140" height="90" rx="8" fill="#083344" stroke="#06B6D4" stroke-width="1.2"/>
      <text x="70" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Next.js 15 Radar</text>
      <text x="70" y="50" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Live Operator UI</text>
      <text x="70" y="70" fill="#67E8F9" font-family="sans-serif" font-size="10" text-anchor="middle">Server-Sent Events</text>
    </g>

    <path d="M 82 200 L 82 260" stroke="#22D3EE" stroke-width="2"/>
    <path d="M 82 350 L 82 410" stroke="#22D3EE" stroke-width="2"/>
  </g>

  <!-- Horizontal Cross-Column Flow Connectors -->
  <!-- Col 1 to Col 2 -->
  <path d="M 185 445 L 240 195" stroke="#60A5FA" stroke-width="2" fill="none"/>
  <!-- Col 2 to Col 3 -->
  <path d="M 380 495 L 435 195" stroke="#F59E0B" stroke-width="2" fill="none"/>
  <!-- Col 3 to Col 4 -->
  <path d="M 575 495 L 630 135" stroke="#8B5CF6" stroke-width="2" fill="none"/>
  <path d="M 575 495 L 630 230" stroke="#8B5CF6" stroke-width="2" fill="none"/>
  <path d="M 575 495 L 630 325" stroke="#8B5CF6" stroke-width="2" fill="none"/>
  <path d="M 575 495 L 630 420" stroke="#8B5CF6" stroke-width="2" fill="none"/>
  <path d="M 575 495 L 630 515" stroke="#8B5CF6" stroke-width="2" fill="none"/>
  <!-- Col 4 to Col 5 -->
  <path d="M 770 135 L 817 195" stroke="#10B981" stroke-width="2" fill="none"/>
  <path d="M 770 230 L 817 195" stroke="#10B981" stroke-width="2" fill="none"/>
  <path d="M 770 325 L 817 195" stroke="#10B981" stroke-width="2" fill="none"/>
  <path d="M 770 420 L 817 195" stroke="#10B981" stroke-width="2" fill="none"/>
</svg>
