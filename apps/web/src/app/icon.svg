<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="segAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0A93C"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="segNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A63"/>
      <stop offset="100%" stop-color="#0C2340"/>
    </linearGradient>
    <linearGradient id="segEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- three modular arcs: detect (amber) -> decide & act (navy) -> recovered & verified (emerald) -->
  <circle cx="60" cy="60" r="40" fill="none" stroke="url(#segAmber)"
          stroke-width="11" stroke-linecap="round"
          stroke-dasharray="55.85 195.48" stroke-dashoffset="0"
          transform="rotate(-90 60 60)"/>

  <circle cx="60" cy="60" r="40" fill="none" stroke="url(#segNavy)"
          stroke-width="11" stroke-linecap="round"
          stroke-dasharray="55.85 195.48" stroke-dashoffset="-83.78"
          transform="rotate(-90 60 60)"/>

  <circle cx="60" cy="60" r="40" fill="none" stroke="url(#segEmerald)"
          stroke-width="11" stroke-linecap="round"
          stroke-dasharray="55.85 195.48" stroke-dashoffset="-167.55"
          transform="rotate(-90 60 60)"/>

  <!-- small directional arrowhead on the emerald segment, showing the loop closes and continues -->
  <path d="M 83 30 L 90.5 33.8 L 85.5 40.4 Z" fill="#059669"/>

  <!-- center pulse: the system watching live signals -->
  <circle cx="60" cy="60" r="6.5" fill="#0C2340"/>
  <circle cx="60" cy="60" r="6.5" fill="none" stroke="#0C2340" stroke-width="1.5" opacity="0.35">
    <animate attributeName="r" values="6.5;14;6.5" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0;0.35" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
